name: Import Jiuye Sub Manager source

on:
  push:
    paths:
      - .github/workflows/import-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download source archive
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://temp.sh/aeVrQ/jiuye-sub-manager-source.tar.gz" \
            --output /tmp/jiuye-sub-manager-source.tar.gz
          echo "dcaeee8766b017db9c7110854dff9b900752fe4a245ae50160d55ea95ade4480  /tmp/jiuye-sub-manager-source.tar.gz" | sha256sum --check -

      - name: Replace repository tree
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar --extract --gzip --file /tmp/jiuye-sub-manager-source.tar.gz --strip-components=1 --directory .

      - name: Commit and push source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: import Jiuye Sub Manager source"
          git push origin HEAD:main
